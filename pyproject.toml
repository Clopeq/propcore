[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "propcore"
version = "0.2.0"
description = "Rocket propulsion and test-data formulas for the ABORT project"
readme = "README.md"
requires-python = ">=3.14"
authors = [
	{ name = "Sebastian Krol" },
]
license = { file = "LICENSE" }
dependencies = [
	"coolprop>=8.0.0",
	"numpy",
	"scipy",
]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Science/Research",
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Operating System :: OS Independent",
	"Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/Clopeq/propcore"
Repository = "https://github.com/Clopeq/propcore"
Issues = "https://github.com/Clopeq/propcore/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["propcore*"]
